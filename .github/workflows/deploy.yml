name: Deploy to GitHub Pages

on:
  # Publica a cada push na main e permite rodar à mão pela aba Actions.
  push:
    branches: [main]
  workflow_dispatch:

# O token só precisa ler o código e publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela uma que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Testes (dados, gráficos, acessibilidade estática, contraste, workflow),
      # build de produção e testes do artefato gerado.
      - name: Verificar e construir
        run: npm run check

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
